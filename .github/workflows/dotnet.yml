name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test .NET 8.0
      run: dotnet test ReadHeavyCollections.Tests/ReadHeavyCollections.Tests.csproj --framework net8.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net8.0.cobertura.xml --results-directory ${{ github.workspace }}/coverage

    - name: Test .NET 9.0
      run: dotnet test ReadHeavyCollections.Tests/ReadHeavyCollections.Tests.csproj --framework net9.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net9.0.cobertura.xml --results-directory ${{ github.workspace }}/coverage

    - name: Test .NET 10.0
      run: dotnet test ReadHeavyCollections.Tests/ReadHeavyCollections.Tests.csproj --framework net10.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net10.0.cobertura.xml --results-directory ${{ github.workspace }}/coverage

    - name: Code Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ${{ github.workspace }}/coverage

    - name: Run benchmark (net10.0)
      run: dotnet run --framework net10.0 --configuration Release --exporters json --filter '*'
      working-directory: Benchmarks

    - name: Run benchmark (net9.0)
      run: dotnet run --framework net9.0 --configuration Release --exporters json --filter '*'
      working-directory: Benchmarks

    - name: Run benchmark (net8.0)
      run: dotnet run --framework net8.0 --configuration Release --exporters json --filter '*'
      working-directory: Benchmarks
